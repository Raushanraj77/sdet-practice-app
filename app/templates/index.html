<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SDET Practice Application</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <!-- =====================================================
         LOGIN PAGE
    ====================================================== -->

    <div id="login-page" class="page">

        <div class="login-card">

            <h1>SDET Practice Application</h1>

            <h2>Login</h2>

            <form id="login-form">

                <label for="login-email">
                    Email
                </label>

                <input id="login-email" type="email" autocomplete="username" required>

                <label for="login-password">
                    Password
                </label>

                <input id="login-password" type="password" autocomplete="current-password" required>

                <button type="submit" class="primary-btn">
                    Login
                </button>

            </form>

            <div id="login-error" class="message error"></div>

        </div>

    </div>


    <!-- =====================================================
         DASHBOARD PAGE
    ====================================================== -->

    <div id="dashboard-page" class="page hidden">

        <header class="header">

            <div>

                <h1>SDET Practice Application</h1>

                <p>User Management Dashboard</p>

            </div>

            <div class="user-info">

                <span id="current-user"></span>

                <button id="logout-btn" class="secondary-btn" type="button">
                    Logout
                </button>

            </div>

        </header>


        <main class="container">

            <section class="card">

                <div class="section-header">

                    <h2>Users</h2>

                    <button id="create-user-btn" class="primary-btn" type="button">
                        + Create User
                    </button>

                </div>


                <div id="message" class="message"></div>


                <!-- Users Table -->

                <div class="table-container">

                    <table>

                        <thead>

                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>

                        </thead>

                        <tbody id="users-body">
                        </tbody>

                    </table>

                </div>

            </section>

        </main>

    </div>


    <!-- =====================================================
         CREATE / EDIT USER MODAL
    ====================================================== -->

    <div id="user-modal" class="modal hidden">

        <div class="modal-content">

            <!-- Modal Header -->

            <div class="modal-header">

                <h2 id="modal-title">
                    Create User
                </h2>

                <button id="close-modal" class="close-btn" type="button" aria-label="Close">
                    ×
                </button>

            </div>


            <!-- User Form -->

            <form id="user-form">

                <!-- Hidden ID
                     Empty = Create
                     Populated = Edit
                -->

                <input type="hidden" id="user-id">


                <!-- Name -->

                <div class="form-group">

                    <label for="name">
                        Name
                    </label>

                    <input type="text" id="name" name="name" maxlength="100" required>

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input type="email" id="email" name="email" maxlength="255" required>

                </div>


                <!-- Password -->

                <div id="password-group" class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input type="password" id="password" name="password" minlength="8" autocomplete="new-password">

                    <small>
                        Password must contain at least 8 characters.
                    </small>

                </div>


                <!-- Confirm Password -->

                <div id="confirm-password-group" class="form-group">

                    <label for="confirm-password">
                        Confirm Password
                    </label>

                    <input type="password" id="confirm-password" name="confirm-password" minlength="8"
                        autocomplete="new-password">

                </div>


                <!-- Form Actions -->

                <div class="modal-actions">

                    <button id="cancel-btn" type="button" class="secondary-btn">
                        Cancel
                    </button>

                    <button type="submit" class="primary-btn">
                        Save User
                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="/static/js/users.js"></script>

</body>

</html>
