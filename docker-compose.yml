services:
  postgres:
    image: postgres:17
    container_name: sdet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sdet_practice
      POSTGRES_USER: sdet_user
      POSTGRES_PASSWORD: sdet_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: